name: KPI anomaly agent

on:
  schedule:
    - cron: "0 3 * * *"        # every day at 03:00 UTC
  workflow_dispatch:            # lets you run it manually from the Actions tab
    inputs:
      as_of:
        description: "Replay date, e.g. 2025-11-30 (leave empty for latest data)"
        required: false
      lookback:
        description: "Days to look back, e.g. 5 (leave empty to use config.yaml)"
        required: false

permissions:
  contents: write               # needed to save the alert log back to the repo

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run agent
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AS_OF: ${{ github.event.inputs.as_of }}
          LOOKBACK: ${{ github.event.inputs.lookback }}
        run: |
          ARGS=""
          if [ -n "$AS_OF" ]; then ARGS="$ARGS --as-of $AS_OF"; fi
          if [ -n "$LOOKBACK" ]; then ARGS="$ARGS --lookback $LOOKBACK"; fi
          python -m src.main $ARGS

      - name: Upload email preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-preview
          path: outputs/email_preview.html
          if-no-files-found: ignore

      - name: Save alert log (remembers what was already reported)
        if: always()
        run: |
          git config user.name "kpi-bot"
          git config user.email "kpi-bot@users.noreply.github.com"
          git add -f outputs/alerts_log.csv || true
          git commit -m "Update alert log" || echo "No changes to commit"
          git push || echo "Nothing to push"